<!DOCTYPE html> <html lang="sr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <title>FoodStore</title> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <style> :root{ --accent:#7a1f2b; --accent-dark:#54131d; --bg:#f6f7f5; --muted:#6c7a72; }
body{

.icon-fallback{

height:100%;
align-items:center;
justify-content:center;

.price{

.btn-accent{

border-color:var(--accent);

}
.btn-accent:hover{
background:var(--accent-dark);
border-color:var(--accent-dark);
color:#fff;
}
footer{
background:#54131d;
color:#e8d0d4;
padding:28px 20px;
margin-top:48px;

}
.cart-badge{
background:#fff;

}
.auth-card{

}

</style></head> <body> <div id="app"></div> <script>

const COMPANY={
name:'FoodStore DOO',
address:'Test ulica 1, 11000 Beograd',

pib:'123456789',
maticniBroj:'987654321'
};
function getUsers(){
return JSON.parse(localStorage.getItem('ss_users')||'[]');
}
function saveUsers(u){
localStorage.setItem('ss_users',JSON.stringify(u));
}
function getLoggedIn(){
return localStorage.getItem('ss_logged_in');
}
function setLoggedIn(e){
e
? localStorage.setItem('ss_logged_in',e)
: localStorage.removeItem('ss_logged_in');
}
function getCart(){
return JSON.parse(localStorage.getItem('ss_cart')||'[]');
}
function saveCart(c){
localStorage.setItem('ss_cart',JSON.stringify(c));
}
function addToCart(id){
const c=getCart();
c.push(id);
saveCart(c);
render();
}
function clearCart(){
saveCart([]);
render();
}
function logout(){
setLoggedIn(null);
location.hash='#/';
}
function header(){
const email=getLoggedIn();
const acc = email
? `<li class="nav-item">
<a class="nav-link" href="#/account" id="nav-account">${email}</a>
</li>
   <li class="nav-item">
     <a class="nav-link"
        href="#"

        onclick="logout();return false;">

: `<li class="nav-item">
     <a class="nav-link" href="#/login" id="nav-login">

     </a>
   </li>

   <li class="nav-item">
     <a class="nav-link" href="#/register" id="nav-register">
       Registracija
     </a>
   </li>`;

return `<nav class="navbar navbar-expand-lg navbar-custom navbar-dark sticky-top">
<div class="container-fluid px-3 px-lg-4">

  <a class="navbar-brand" href="#/" id="nav-home">

  </a>

        <a
          class="nav-link"
          href="#/category/Pi%C4%87e"
          id="nav-cat-pice">
          Piće
        </a>
      </li>

    </ul>

    <ul class="navbar-nav align-items-lg-center">

      <li class="nav-item">

        <a

          href="#/cart"
          id="nav-cart">

          Korpa

          <span
            class="badge cart-badge rounded-pill ms-1"
            id="cart-count">
            ${getCart().length}
          </span>

        </a>

      </li>

      ${acc}

    </ul>

  </div>

</div>

</nav>`; }
function footerHtml(){
return `<footer>
<div class="container">

  <strong id="company-name">
    ${COMPANY.name}
  </strong>

  <br>

  <span id="company-address">
    ${COMPANY.address}
  </span>

  <span id="company-pib">

  </span>

  &middot;

  <span id="company-maticni-broj">

  </span>

</div>

</footer>`; }
const ICONS={
'Pizze':
'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
'<path d="M4 4c5.5-2 11-1.5 16 1.5L12 21 4 4z"/>' +
'<circle cx="9" cy="8" r="1"/>' +
'<circle cx="13" cy="12" r="1"/>' +
'<circle cx="10" cy="15" r="1"/>' +
'</svg>',
'Dezerti':
'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
'<path d="M5 9h14l-1 10H6L5 9z"/>' +
'<path d="M8 9c0-3 1.5-5 4-5s4 2 4 5"/>' +
'<path d="M8 13h8M9 16h6"/>' +
'</svg>',
'Piće':
'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
'<path d="M7 3h10l-1 18H8L7 3z"/>' +
'<path d="M7.5 7h9M9 12h6"/>' +
'</svg>'
};
function sidebarHtml(){
return `<div class="sidebar mb-4">
<div class="sidebar-title">
  KATEGORIJE
</div>

<a
  href="#/category/Pizze"
  id="side-cat-pizze">
  Pizze
</a>

<a
  href="#/category/Dezerti"

</a>

<a
  href="#/category/Pi%C4%87e"

</a>

</div>`; }
function productCard(p){
return `<div class="col-sm-6 col-lg-4 mb-4">
<div
  class="card product-card"
  id="product-${p.id}">

  <div class="product-img-wrap">

    <img
      src="${p.img}"
      alt="${p.name}"
      loading="lazy"
      onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

    <span class="icon-fallback">
      ${ICONS[p.category]||''}
    </span>

  </div>

  <div class="card-body d-flex flex-column">

    <h3 class="h6 mb-1">
      ${p.name}
    </h3>

    <div class="text-muted small mb-2">

    </div>

    <div class="price mb-3">
      ${p.price} RSD
    </div>

    <button
      class="btn btn-accent mt-auto"

      onclick="addToCart('${p.id}')">

</div>

</div>`; }
function productGridPage(title,items){
return `<div class="container py-4">

        items.map(productCard).join('') ||

</div>

</div>`; }

  </p>

</div>

<main>

  ${productGridPage('Svi proizvodi',PRODUCTS)}

}

function pageCategory(cat){
const name=decodeURIComponent(cat);
const items=PRODUCTS.filter(
p=>p.category===name
);
return `<main>
${productGridPage(name,items)}

</main>`; }
function pageRegister(){
return `<main>
<div class="auth-card">

  <h1>
    Registracija
  </h1>

  <form
    id="register-form"
    onsubmit="return doRegister(event)">

    <div class="mb-3">

      <label class="form-label">
        Ime
      </label>

      <input
        class="form-control"
        id="reg-first-name"
        required>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Prezime
      </label>

      <input
        class="form-control"
        id="reg-last-name"
        required>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Email
      </label>

      <input
        class="form-control"
        id="reg-email"
        type="email"
        required>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Lozinka
      </label>

      <input
        class="form-control"
        id="reg-password"
        type="password"
        required>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Telefon
      </label>

      <input
        class="form-control"
        id="reg-phone"
        required>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Grad
      </label>

      <input
        class="form-control"
        id="reg-city"
        required>

    </div>

    <button
      type="submit"
      class="btn btn-accent w-100"
      id="reg-submit">

      Registruj se

    </button>

  </form>

  <div
    id="reg-message"
    class="mt-3">
  </div>

</div>

</main>`; }
function doRegister(ev){
ev.preventDefault();
const users=getUsers();
const email=document
.getElementById('reg-email')
.value
.trim();
if(users.some(u=>u.email===email)){
document.getElementById('reg-message').innerHTML=
  '<p class="text-danger" id="reg-error">Email već postoji.</p>';

return false;

}

users.push({
firstName:
  document.getElementById('reg-first-name').value,

lastName:
  document.getElementById('reg-last-name').value,

email:email,

password:
  document.getElementById('reg-password').value,

phone:
  document.getElementById('reg-phone').value,

city:
  document.getElementById('reg-city').value

});
saveUsers(users);
document.getElementById('reg-message').innerHTML=
'<p class="text-success fw-semibold" id="reg-success">Registracija uspešna. Možete se prijaviti.</p>';
return false;
}
function pageLogin(){
return `<main>
<div class="auth-card">

  <h1>
    Prijava
  </h1>

  <form
    id="login-form"
    onsubmit="return doLogin(event)">

    <div class="mb-3">

      <label class="form-label">
        Email
      </label>

      <input
        class="form-control"
        id="login-email"
        type="email"
        required>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Lozinka
      </label>

      <input
        class="form-control"
        id="login-password"
        type="password"
        required>

    </div>

    <button
      type="submit"
      class="btn btn-accent w-100"
      id="login-submit">

      Prijavi se

    </button>

  </form>

  <div
    id="login-message"
    class="mt-3">
  </div>

</div>

</main>`; }
function doLogin(ev){
ev.preventDefault();
const email=document
.getElementById('login-email')
.value
.trim();
const pass=document
.getElementById('login-password')
.value;
const user=getUsers().find(
u=>u.email===email && u.password===pass
);
if(!user){
document.getElementById('login-message').innerHTML=
  '<p class="text-danger" id="login-error">Pogrešan email ili lozinka.</p>';

return false;

}

setLoggedIn(email);
location.hash='#/account';
return false;
}
function pageAccount(){
const email=getLoggedIn();
if(!email){
location.hash='#/login';

return '<main><p>Preusmeravanje na prijavu...</p></main>';

}

const user=getUsers().find(
u=>u.email===email
);
if(!user){
return '<main><p class="text-danger">Korisnik nije pronađen.</p></main>';

}

return `<main>
<div class="container py-4">

  <div class="auth-card">

    <h1>
      Moj nalog
    </h1>

    <p>
      Ime:
      <strong id="profile-first-name">
        ${user.firstName}
      </strong>
    </p>

    <p>
      Prezime:
      <strong id="profile-last-name">
        ${user.lastName}
      </strong>
    </p>

    <p>
      Email:
      <strong id="profile-email">
        ${user.email}
      </strong>
    </p>

    <p>
      Telefon:
      <strong id="profile-phone">
        ${user.phone}
      </strong>
    </p>

    <p>
      Grad:
      <strong id="profile-city">
        ${user.city}
      </strong>
    </p>

  </div>

</div>

</main>`; }
function pageCart(){
const cart=getCart();
const items=cart
.map(id=>PRODUCTS.find(p=>p.id===id))
.filter(Boolean);
const total=items.reduce(
(s,p)=>s+p.price,
0
);
const rows=items.map(p=>
`<tr>

  <td>
    ${p.name}
  </td>

  <td>
    ${p.category}
  </td>

  <td>
    ${p.price} RSD
  </td>

</tr>`

).join('');
return `<main>
<div class="container py-4">

  <h1 class="page-title h4">
    Korpa
  </h1>

  <table
    class="table bg-white rounded shadow-sm"
    id="cart-table">

    <thead>

      <tr>

        <th>
          Proizvod
        </th>

        <th>
          Kategorija
        </th>

        <th>
          Cena
        </th>

      </tr>

    </thead>

    <tbody>

      ${
        rows ||
        '<tr><td colspan="3">Korpa je prazna.</td></tr>'
      }

    </tbody>

  </table>

  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

    <button
      class="btn btn-outline-danger"
      id="clear-cart-btn"
      onclick="clearCart()"
      ${items.length?'':'disabled'}>

      Isprazni korpu

    </button>

    <div class="total-box">

      Ukupno:

      <span id="cart-total">
        ${total}
      </span>

      RSD

    </div>

  </div>

</div>

</main>`; }
function body(hash){
if(hash==='#/'||hash===''){
return pageHome();
}
if(hash==='#/register'){
return pageRegister();
}
if(hash==='#/login'){
return pageLogin();
}
if(hash==='#/account'){
return pageAccount();
}
if(hash==='#/cart'){
return pageCart();
}
if(hash.startsWith('#/category/')){
return pageCategory(
  hash.replace('#/category/','')
);

}
return `
<main>
  <div class="container py-4">

    <p>
      Stranica nije pronađena.
    </p>

  </div>

</main>`;

}

function render(){
document.getElementById('app').innerHTML =
header() +
body(location.hash) +
footerHtml();
}
window.addEventListener(
'hashchange',
render
);
window.addEventListener(
'DOMContentLoaded',
render
);
render();</script> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> </body> </html>
